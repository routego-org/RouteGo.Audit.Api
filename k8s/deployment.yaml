# Audit — append-only audit log in DynamoDB
# Source: RouteGo.Audit.Api   Image: routego/audit   ServiceAccount -> IAM role routego-audit-pod-role (EKS Pod Identity)
# Settings that differ per AWS account come from ConfigMap routego-environment (RouteGo.Infra/k8s/platform/environment.yaml);
# $(VAR) expands an env var defined above it. Secrets are read by the app from Secrets Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels: { app.kubernetes.io/name: audit, app.kubernetes.io/part-of: routego }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: audit }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: audit, app.kubernetes.io/part-of: routego }
    spec:
      serviceAccountName: audit
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654              # the 'app' user of the mcr.microsoft.com/dotnet/aspnet image
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit
          image: routego/audit      # rewritten to the ECR URL + tag by k8s/kustomization.yaml
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: AWS_REGION }
            - name: AWS_ACCOUNT_ID
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: AWS_ACCOUNT_ID }
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: PUBLIC_URL }
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DOTNET_gcServer          # workstation GC: less memory per pod
              value: "0"
            - name: IdentityIssuer
              value: "$(PUBLIC_URL)"
            - name: IdentityAudience
              value: "routego"
            - name: IdentityJwksUrl
              value: "http://identity/.well-known/jwks.json"
            - name: AuditTableName
              value: "routego-audit-log"
            - name: AuditEventsQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/audit-q"
            - name: AuditEventsDeadLetterQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/audit-dlq"
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          startupProbe:              # .NET cold start + first AWS calls; up to 2 minutes
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:            # database + dependencies
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
